name: 青课 PR 验证

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Logic tests
        run: ./gradlew :composeApp:desktopTest --max-workers=2 -Dorg.gradle.java.home="$JAVA_HOME"
      - name: Debug APK (does not require signing secrets)
        run: ./gradlew :androidApp:assembleDebug --max-workers=2 -Dorg.gradle.java.home="$JAVA_HOME"

  miuix-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Render tests (JDK21)
        run: ./gradlew :composeApp:desktopTest --max-workers=2 -Dorg.gradle.java.home="$JAVA_HOME"
