<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>澄课 · 初步 UI</title>
  <style>
    :root {
      --bg: #eef1f6;
      --card: #ffffff;
      --text: rgba(0, 0, 0, 0.9);
      --sub: rgba(0, 0, 0, 0.5);
      --mute: rgba(0, 0, 0, 0.34);
      --line: rgba(0, 0, 0, 0.06);
      --blue: #3482ff;
      --blue-soft: #e4eeff;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "MiSans", "PingFang SC", "Noto Sans SC", "HarmonyOS Sans SC", system-ui, sans-serif;
      background: #dfe3eb;
      color: var(--text);
    }
    .page { max-width: 1480px; margin: 0 auto; padding: 28px 24px 64px; }
    h1 { font-size: 28px; font-weight: 650; margin: 0 0 6px; letter-spacing: -0.03em; }
    .lead { color: var(--sub); margin: 0 0 22px; font-size: 14px; line-height: 1.65; max-width: 880px; }
    .lead a { color: var(--blue); text-decoration: none; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
    }
    .shot { text-align: center; }
    .shot figcaption { margin-top: 10px; font-size: 13px; color: var(--sub); }
    .phone {
      width: 280px;
      height: 618px;
      margin: 0 auto;
      border-radius: 30px;
      background: #111;
      padding: 8px;
      box-shadow: 0 20px 44px rgba(20, 28, 45, 0.2);
    }
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 24px;
      background: var(--bg);
      overflow: hidden;
      position: relative;
      text-align: left;
    }
    .wash {
      position: absolute;
      inset: 0 0 auto;
      height: 210px;
      background:
        radial-gradient(ellipse at 12% -10%, #b8d2ff 0%, transparent 52%),
        radial-gradient(ellipse at 92% 8%, #c8f0ea 0%, transparent 42%),
        radial-gradient(ellipse at 60% 0%, #ffe7c8 0%, transparent 36%);
      pointer-events: none;
    }
    .wash.cool {
      background:
        radial-gradient(ellipse at 20% -10%, #c5d8ff 0%, transparent 50%),
        radial-gradient(ellipse at 100% 10%, #d9e4ff 0%, transparent 40%);
    }
    .status {
      position: relative;
      z-index: 2;
      height: 22px;
      padding: 6px 16px 0;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 650;
    }
    .app { position: absolute; inset: 22px 0 0; display: flex; flex-direction: column; }
    .scroll { flex: 1; overflow: hidden; padding: 0 11px 62px; position: relative; z-index: 1; }
    .hello { font-size: 11px; color: var(--sub); padding: 4px 4px 0; }
    .title { font-size: 22px; font-weight: 680; padding: 1px 4px 2px; letter-spacing: -0.03em; }
    .title.small { font-size: 17px; padding-top: 8px; }
    .sub { font-size: 11px; color: var(--sub); padding: 0 4px 8px; }
    .hero {
      background: linear-gradient(160deg, #2f74ff 0%, #5aa0ff 58%, #7ec8ff 100%);
      color: #fff;
      border-radius: 18px;
      padding: 12px 12px 11px;
      margin-bottom: 8px;
      box-shadow: 0 10px 22px rgba(52, 130, 255, 0.28);
    }
    .hero .k { font-size: 10px; opacity: 0.82; }
    .hero .n { font-size: 18px; font-weight: 700; margin: 3px 0 2px; }
    .hero .s { font-size: 11px; opacity: 0.9; line-height: 1.4; }
    .hero .bar { height: 4px; background: rgba(255,255,255,0.28); border-radius: 99px; margin-top: 8px; overflow: hidden; }
    .hero .bar i { display: block; width: 62%; height: 100%; background: #fff; border-radius: 99px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 8px; }
    .stat {
      background: var(--card);
      border-radius: 12px;
      padding: 7px 5px 6px;
      text-align: center;
    }
    .stat b { display: block; font-size: 13px; font-weight: 700; }
    .stat span { font-size: 8.5px; color: var(--sub); }
    .sec { font-size: 11px; color: var(--sub); padding: 5px 4px 5px; font-weight: 620; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 10px 11px;
      margin-bottom: 6px;
    }
    .card .n { font-size: 13px; font-weight: 650; }
    .card .s { font-size: 10.5px; color: var(--sub); margin-top: 3px; line-height: 1.4; }
    .line {
      display: flex; gap: 8px; align-items: flex-start;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ff7a6e; margin-top: 4px; flex: none;
      box-shadow: 0 0 0 3px #ffd9d6;
    }
    .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .q {
      background: var(--card);
      border-radius: 13px;
      padding: 9px 6px 8px;
      text-align: center;
      font-size: 10px;
      font-weight: 620;
    }
    .q i {
      display: block; width: 22px; height: 22px; margin: 0 auto 5px;
      border-radius: 8px;
    }
    .q.a i { background: #dce9ff; }
    .q.b i { background: #d8f3e4; }
    .q.c i { background: #ffe6cc; }
    .fnav {
      position: absolute;
      left: 10px; right: 10px; bottom: 8px;
      height: 46px;
      border-radius: 23px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(22px) saturate(1.6);
      -webkit-backdrop-filter: blur(22px) saturate(1.6);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: 0 10px 24px rgba(28, 40, 62, 0.14);
      z-index: 3;
    }
    .fnav span {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 8.5px; color: var(--mute); font-weight: 620;
    }
    .fnav span.on { color: var(--blue); }
    .fnav i {
      width: 15px; height: 15px; border-radius: 5px;
      background: currentColor; opacity: 0.9;
    }
    .field {
      background: #f4f5f8;
      border-radius: 12px;
      padding: 10px 11px;
      margin-bottom: 6px;
      color: var(--mute);
      font-size: 12px;
    }
    .btn {
      height: 34px; border-radius: 17px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 650;
    }
    .btn.primary { background: var(--blue); color: #fff; }
    .btn.ghost { background: #e6e8ee; color: var(--text); }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .pref { background: var(--card); overflow: hidden; border-radius: 14px; margin-bottom: 6px; }
    .pref .item {
      padding: 9px 11px;
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid var(--line); gap: 8px;
    }
    .pref .item:first-child { border-top: 0; }
    .pref .l { font-size: 12px; }
    .pref .r { font-size: 11px; color: var(--sub); text-align: right; }
    .sw { width: 30px; height: 17px; border-radius: 99px; background: #3482ff; position: relative; }
    .sw::after {
      content: ""; position: absolute; right: 2px; top: 2px;
      width: 13px; height: 13px; border-radius: 50%; background: #fff;
    }
    .sw.off { background: #c8c9ce; }
    .sw.off::after { left: 2px; right: auto; }
    .who { display: flex; gap: 9px; align-items: center; }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%; flex: none;
      background: linear-gradient(180deg, #9db6d8, #6e84a6);
    }
    .avatar.empty { background: linear-gradient(180deg, #d5dae3, #b7becb); }
    table.kb {
      width: 100%; border-collapse: separate; border-spacing: 2px;
      table-layout: fixed; font-size: 8px; line-height: 1.15;
    }
    table.kb th { font-weight: 650; color: var(--sub); padding: 2px 0 3px; }
    table.kb th.on { color: var(--blue); }
    table.kb td {
      background: rgba(255,255,255,0.72);
      border-radius: 5px; height: 40px; vertical-align: top; padding: 2px 1px;
    }
    table.kb td.slot { background: transparent; color: var(--mute); width: 17px; text-align: center; padding-top: 12px; }
    .blk { border-radius: 5px; padding: 2px 2px 0; height: 100%; }
    .blk b { display: block; font-size: 8.5px; }
    .dim { opacity: 0.4; }
    .c-ai { background: #dce9ff; } .c-math { background: #d8f3e4; }
    .c-pol { background: #ffe6cc; } .c-off { background: #eadbff; }
    .c-mil { background: #ffd9d6; } .c-ee { background: #d4f1f6; }
    .c-c { background: #dde1ff; } .c-en { background: #fff1c7; }
    .c-his { background: #ffdcea; } .c-pe { background: #d8f0d4; }
    .c-fit { background: #e4f3d8; } .c-web { background: #d9e4ff; }
    .c-car { background: #ffe4d2; }
    .pills { display: flex; gap: 4px; overflow: hidden; margin: 0 0 6px; }
    .pill {
      flex: none; font-size: 9px; padding: 3px 7px; border-radius: 99px;
      background: rgba(255,255,255,0.7); color: var(--sub);
    }
    .pill.on { background: #3482ff; color: #fff; }
    .ring-row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; }
    .ring {
      width: 56px; height: 56px; border-radius: 50%;
      background: conic-gradient(#3482ff 0 8%, #e6e8ee 0);
      display: grid; place-items: center;
    }
    .ring span {
      width: 40px; height: 40px; border-radius: 50%; background: #fff;
      display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--blue);
    }
    .tag {
      display: inline-block; font-size: 9px; padding: 1px 6px; border-radius: 99px;
      background: var(--blue-soft); color: var(--blue); font-weight: 650; margin-right: 4px;
    }
  </style>
</head>
